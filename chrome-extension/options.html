<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TalentXcel Extension Settings</title>
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon32.png" alt="TalentXcel" class="logo">
      <h1>TalentXcel Extension Settings</h1>
    </header>

    <main class="main-content">
      <section class="settings-section">
        <h2>Notifications</h2>
        <div class="setting-item">
          <label class="setting-label">
            <input type="checkbox" id="notifications-enabled" class="setting-checkbox">
            <span class="checkmark"></span>
            Enable notifications
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h2>Account</h2>
        <div class="account-info">
          <h3 id="account-name">Loading...</h3>
          <p id="account-email">...</p>
        </div>
        <button id="logout-btn" class="action-button">Logout</button>
      </section>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
