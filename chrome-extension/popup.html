<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalentXcel Extension</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon32.png" alt="TalentXcel" class="logo">
      <h1>TalentXcel</h1>
    </div>

    <div id="auth-section" class="section">
      <h2>Welcome to TalentXcel</h2>
      <p>Sign in to access AI-powered career tools</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <p class="link">
        <a href="https://talentxcel.in/auth/signup" target="_blank">Create Account</a>
      </p>
    </div>

    <div id="main-section" class="section hidden">
      <div class="user-info">
        <div class="user-avatar">
          <img id="user-avatar" src="icons/icon32.png" alt="User">
        </div>
        <div class="user-details">
          <h3 id="user-name">Loading...</h3>
          <p id="user-email">...</p>
        </div>
      </div>

      <div class="balance-card">
        <div class="balance-info">
          <span class="balance-label">TXC Balance</span>
          <span id="txc-balance" class="balance-amount">0</span>
        </div>
        <button id="earn-tokens-btn" class="btn-secondary">Earn More</button>
      </div>

      <div class="quick-actions">
        <h4>Quick Actions</h4>
        <button id="sync-profile-btn" class="action-btn">
          <span class="icon">🔄</span>
          Sync Profile
        </button>
        <button id="job-matches-btn" class="action-btn">
          <span class="icon">💼</span>
          View Job Matches
        </button>
      </div>

      <div class="footer">
        <button id="settings-btn" class="btn-text">Settings</button>
        <button id="logout-btn" class="btn-text">Logout</button>
      </div>
    </div>

    <div id="loading-section" class="section hidden">
      <div class="loader"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
