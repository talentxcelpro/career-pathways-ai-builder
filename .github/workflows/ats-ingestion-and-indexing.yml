name: Multi-ATS Ingestion & Google Indexing API Dispatcher

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ats-ingestion-and-indexing:
    name: Ingest ATS Jobs, Rebuild Sitemaps & Dispatch Indexing API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Run Multi-ATS Ingestion Engine
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/ingest-ats-jobs.ts

      - name: Rebuild Partitioned XML Sitemaps
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/generate-sitemap.ts

      - name: Dispatch Google Indexing API Outbox
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/dispatch-indexing-api.ts --limit=45

      - name: Execute Full Production SEO CI Gate
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/seo-ci-gate.ts

      - name: Commit & Push Sitemaps and Telemetry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ats-ingestion): automated 6h multi-ats ingestion and sitemap sync [skip ci]"
          file_pattern: "public/sitemap*.xml"
