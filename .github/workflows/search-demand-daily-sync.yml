name: Search Demand Daily Sync & Intelligence Report

on:
  schedule:
    # Daily at 01:23 UTC (staggered away from peak hours; zero high-frequency polling)
    - cron: '23 1 * * *'
  workflow_dispatch:

concurrency:
  group: search-demand-daily-sync
  cancel-in-progress: false

jobs:
  daily-search-intelligence:
    name: Sync GSC/GA4 & Live Inventory + Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24+ (native node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run GSC + GA4 Incremental Sync
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx tsx scripts/search-intelligence/sync-gsc-telemetry.ts

      - name: Run Qualification & Daily Intelligence Cycle
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/search-intelligence/run-intelligence-cycle.ts

      - name: Run Phase 4 Daily Autonomous Growth Cycle (Bounded)
        env:
          TX_SUPABASE_URL: ${{ secrets.TX_SUPABASE_URL }}
          TALENTXCEL_SERVICE_ROLE_KEY: ${{ secrets.TALENTXCEL_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx tsx scripts/search-intelligence/run-phase4-autonomous-growth.ts --mode=daily
