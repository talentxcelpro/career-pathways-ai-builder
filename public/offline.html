<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're Offline - JobMagnet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, hsl(var(--primary, 215 25% 27%)), hsl(var(--primary-glow, 215 25% 40%)));
      color: white;
      text-align: center;
    }
    
    .offline-container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 3rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      font-weight: 600;
    }
    
    p {
      margin: 0 0 2rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    
    .retry-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    
    .retry-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    
    .features {
      margin-top: 2rem;
      text-align: left;
    }
    
    .feature {
      display: flex;
      align-items: center;
      margin: 0.5rem 0;
      opacity: 0.8;
    }
    
    .feature-icon {
      margin-right: 0.5rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry - some features are still available!</p>
    
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">💼</span>
        <span>View cached job listings</span>
      </div>
      <div class="feature">
        <span class="feature-icon">👤</span>
        <span>Access your profile</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📝</span>
        <span>Edit drafts offline</span>
      </div>
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Check connection status
    if (navigator.onLine) {
      window.location.reload();
    }
  </script>
</body>
</html>
