    <!-- Improved cache and version management -->
    <script>
      (function() {
        // Prevent caching issues by adding version check
        const APP_VERSION = Date.now().toString();
        sessionStorage.setItem('app_version', APP_VERSION);
        
        // Only clear service workers and caches on first load
        const isFirstLoad = !sessionStorage.getItem('app_loaded');
        
        if (isFirstLoad && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(registration => registration.unregister());
          });
          if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
          }
          sessionStorage.setItem('app_loaded', 'true');
        }
      })();
    </script>
