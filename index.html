    <!-- Evict any stale Service Workers on localhost development -->
    <script>
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
      }
    </script>

    <!-- WebSite + SearchAction: tells Google the site has a search function at /jobs?search= -->

    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TalentXcel",
      "alternateName": "TalentXcel — AI Career Platform",
      "url": "https://talentxcel.in",
      "description": "Careers, Designed — Not Discovered. India's AI career platform for job search, ATS resume building, college discovery, interview prep and skill growth.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://talentxcel.in/jobs?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"

    }
    </script>
