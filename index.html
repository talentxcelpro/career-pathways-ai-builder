    <!-- Structured Data -->
    <!-- WebSite + SearchAction: tells Google the site has a search function at /jobs?search= -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TalentXcel",
      "alternateName": "TalentXcel — AI Career Platform",
      "url": "https://talentxcel.in",
      "description": "Careers, Designed — Not Discovered. India's AI career platform for job search, ATS resume building, college discovery, interview prep and skill growth.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://talentxcel.in/jobs?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
