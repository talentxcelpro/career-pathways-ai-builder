    <!-- Evict any stale Service Workers across web and mobile -->

        navigator.serviceWorker.getRegistrations().then(function(regs) {

            regs[i].unregister();
          }
        }).catch(function() {});
      }
    </script>

    <!-- Structured Data -->
    <!-- WebSite + SearchAction: tells Google the site has a search function at /jobs?search= and /talent?search= -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TalentXcel",
      "alternateName": ["TalentXcel", "TalentXcel — The Professional Talent Network", "TalentXcel Recruiter OS"],
      "url": "https://talentxcel.in",
      "description": "Connect with Tech & Leadership Professionals worldwide. Build your Career Passport, verify skills with TalentScore, discover jobs and connect with hiring teams.",
      "inLanguage": "en-IN",
      "potentialAction": [
        {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://talentxcel.in/jobs?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://talentxcel.in/talent?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      ]
    }
    </script>
    <!-- Organization: core disambiguated entity signal for Google, LinkedIn, and generative AI systems -->
    <script type="application/ld+json">
    {
