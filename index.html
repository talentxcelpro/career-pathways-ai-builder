
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="TalentXcel - AI-Powered Career Platform" />
    <meta property="og:description" content="Your Career. One Platform. Endless Possibilities. Find jobs, grow skills, and network with AI-powered career tools." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talentxcel.in/" />
    <meta property="og:image" content="https://talentxcel.in/lovable-uploads/711de76d-0f05-4939-b8b5-4acd21eb3119.png" />
    <meta property="og:site_name" content="TalentXcel" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@talentxcel" />
    <meta name="twitter:title" content="TalentXcel - AI-Powered Career Platform" />
    <meta name="twitter:description" content="Your Career. One Platform. Endless Possibilities." />
    <meta name="twitter:image" content="https://talentxcel.in/lovable-uploads/711de76d-0f05-4939-b8b5-4acd21eb3119.png" />

    <!-- Additional SEO Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- 🔴 Fix #3: Critical resource preloading and optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://xyz.supabase.co">
    
    <!-- 🔴 Fix #2: Preload LCP hero images -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80" type="image/jpeg" fetchpriority="high">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" type="image/jpeg">
    
    <!-- 🔴 Fix #5: Optimized font loading with display swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    
    <!-- 🔴 Fix #5: Critical CSS for layout stability -->
    <style>
      /* Prevent layout shifts */
      body { font-family: 'Inter', ui-sans-serif, system-ui; margin: 0; -webkit-font-smoothing: antialiased; }
      img { max-width: 100%; height: auto; }
      .hero-image { aspect-ratio: 16/9; min-height: 200px; }
      .loading-skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
      @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
    
    <!-- Google One Tap Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TalentXcel",
      "url": "https://talentxcel.in",
      "description": "AI-Powered Career Platform for job seekers and professionals",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://talentxcel.in/jobs?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
