<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TalentXcel Pro</title>
    <meta
      name="description"
      content="TalentXcel Pro is the command center for professional growth, talent signals, and career momentum."
    />
    <meta name="author" content="TalentXcel" />
    <meta
      name="keywords"
      content="jobs, careers, learning, networking, career intelligence, career development, skills, resume, interview prep"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TalentXcel Pro" />
    <link rel="icon" href="/app-logo.png" type="image/png" />
    <link rel="shortcut icon" href="/app-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app-logo.png" />
    <link rel="canonical" href="https://talentxcel.in/" />
    <meta property="og:title" content="TalentXcel Pro" />
    <meta
      property="og:description"
      content="TalentXcel Pro helps professionals track talent signals, discover roles, and grow with clarity."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talentxcel.in/" />
    <meta
      property="og:image"
      content="https://talentxcel.in/lovable-uploads/711de76d-0f05-4939-b8b5-4acd21eb3119.png"
    />
    <meta property="og:site_name" content="TalentXcel Pro" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@talentxcel" />
    <meta name="twitter:title" content="TalentXcel Pro" />
    <meta
      name="twitter:description"
      content="TalentXcel Pro helps professionals track talent signals, discover roles, and grow with clarity."
    />
    <meta
      name="twitter:image"
      content="https://talentxcel.in/lovable-uploads/711de76d-0f05-4939-b8b5-4acd21eb3119.png"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TalentXcel Pro",
        "url": "https://talentxcel.in",
        "description": "Professional performance platform for job seekers and professionals",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://talentxcel.in/jobs?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body,
      #root {
        min-height: 100vh;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        z-index: 1;
      }

      .boot-shell {
        text-align: center;
      }

      .boot-ring {
        width: 40px;
        height: 40px;
        margin: 0 auto;
        border-radius: 9999px;
        border: 2px solid #2563eb;
        border-top-color: transparent;
        animation: talentxcel-spin 0.9s linear infinite;
      }

      .boot-title {
        margin: 16px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: #475569;
      }

      .boot-copy {
        margin: 8px 0 0;
        font-size: 13px;
        color: #94a3b8;
      }

      @keyframes talentxcel-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-shell">
        <div class="boot-ring"></div>
        <p class="boot-title">Loading TalentXcel</p>
        <p class="boot-copy">Preparing your command center...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
